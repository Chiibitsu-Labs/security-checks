name: security
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  security:
    uses: Chiibitsu-Labs/security-checks/.github/workflows/security.yml@<sha-of-security-checks-main> # pin a SHA, never a branch; Renovate bumps it
    with:
      gitleaks: true # false if the repo already runs chiibitsu/gates
      codeql: false # true for public repos only
