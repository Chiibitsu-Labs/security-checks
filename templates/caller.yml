name: security
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  security:
    # Pin a SHA, never a branch. Keep the `# main` hint: Renovate needs it to know what to bump.
    uses: Chiibitsu-Labs/security-checks/.github/workflows/security.yml@<sha-of-security-checks-main> # main
    with:
      gitleaks: true # false if the repo already runs chiibitsu/gates
      semgrep: true
      codeql: false # true for public repos only
