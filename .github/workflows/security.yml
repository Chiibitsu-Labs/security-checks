name: security

# Reusable workflow. Call it from a repo with templates/caller.yml.
on:
  workflow_call:
    inputs:
      gitleaks:
        description: Run gitleaks. Set false in repos that already scan for secrets (for example via chiibitsu/gates).
        type: boolean
        default: true
      codeql:
        description: Run CodeQL. Public repos only, private repos need GitHub Advanced Security.
        type: boolean
        default: false
      codeql-languages:
        description: CodeQL languages, comma separated. Buildless languages only (javascript-typescript, python, ruby, actions).
        type: string
        default: javascript-typescript
      audit-level:
        description: npm audit fails at this severity or higher.
        type: string
        default: high

permissions:
  contents: read

jobs:
  secrets:
    name: secrets (gitleaks)
    if: ${{ inputs.gitleaks }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          echo "ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            ./gitleaks detect --source . --redact --verbose --log-opts "$BASE..$HEAD"
          else
            ./gitleaks detect --source . --redact --verbose
          fi

  deps:
    name: dependencies (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Audit
        env:
          LEVEL: ${{ inputs.audit-level }}
        run: |
          if [ -f package-lock.json ]; then
            npm audit --omit=dev --audit-level="$LEVEL"
          else
            echo "No package-lock.json, skipping."
          fi

  codeql:
    name: code (CodeQL)
    if: ${{ inputs.codeql }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Validate languages
        env:
          LANGS: ${{ inputs.codeql-languages }}
        run: |
          for l in ${LANGS//,/ }; do
            case "$l" in
              javascript-typescript|javascript|typescript|python|ruby|actions) ;;
              *) echo "Unsupported CodeQL language '$l'. Only buildless languages are supported here."; exit 1 ;;
            esac
          done
      - uses: github/codeql-action/init@9f759ee644a3e7c15c1390abf49868036c00067b # v3.38.3
        with:
          languages: ${{ inputs.codeql-languages }}
      - uses: github/codeql-action/analyze@9f759ee644a3e7c15c1390abf49868036c00067b # v3.38.3
